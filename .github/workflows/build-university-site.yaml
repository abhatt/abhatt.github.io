name: Build university site

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install --upgrade pip
          python -m pip install jupyter nbconvert

      - name: Build university version
        run: |
          bundle exec jekyll build \
            --config _config.yml,_config_university.yaml \
            --destination _site-university

      - name: Create download archive
        run: |
          cd _site-university
          zip -r ../abhatt-university-site.zip .

      - name: Upload site archive
        uses: actions/upload-artifact@v4
        with:
          name: abhatt-university-site
          path: abhatt-university-site.zip
          retention-days: 30
